name: Deploy to VPS

# Runs on every push to main, and can also be triggered manually
# from the GitHub "Actions" tab (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jason52388/yalamanbaby

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows pushing the image to GitHub Container Registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Build the Docker image and push it to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

      # 2. Deploy on the VPS: install Docker if needed, then pull & run.
      - name: Deploy via Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            # Install Docker (with the compose plugin) if it isn't present.
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi

            # Authenticate to GHCR so the VPS can pull the image.
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Project directory on the server.
            mkdir -p /opt/baby
            cd /opt/baby

            # Write the compose file. Runs behind the existing
            # caddy-docker-proxy: no published ports, routed by labels over
            # the shared external `caddy` network.
            cat > docker-compose.yml <<'YAML'
            services:
              web:
                image: ghcr.io/jason52388/yalamanbaby:latest
                restart: unless-stopped
                networks:
                  - caddy
                labels:
                  caddy: ${SITE_DOMAIN}
                  caddy.reverse_proxy: "{{upstreams 80}}"
            networks:
              caddy:
                external: true
            YAML

            # Provide the domain to compose via its .env file (used in the label).
            echo "SITE_DOMAIN=${{ secrets.SITE_DOMAIN }}" > .env

            # Pull the new image and (re)start the container.
            docker compose pull
            docker compose up -d

            # Clean up old image layers to save disk.
            docker image prune -f
