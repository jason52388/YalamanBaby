name: Deploy to Hostinger VPS

# Auto-deploys on push to main. SSHes into the VPS, makes sure a clean clone of
# the repo exists, writes .env from GitHub secrets, then builds and (re)starts
# the container. The actual remote work lives in scripts/deploy-remote.sh and is
# invoked through the local composite action .github/actions/deploy-vps.
#
# Required secrets:
#   Connection:  VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH
#   App config:  SITE_HOSTNAME
#   Auth gate:   BABY_AUTH_HASH (bcrypt), BABY_AUTH_COOKIE (random hex)
# Optional secrets:
#   BABY_HTTP_PORT defaults to 8088
#   PHOTOS_DIR     defaults to /srv/yalaman-photos
#
# RELIABILITY — this is a best-effort, single-attempt deploy:
#   The GitHub runner intermittently can't open a TCP connection to the VPS on
#   port 22 ("dial tcp ...:22: i/o timeout"). The SYN packets are dropped, not
#   refused — the host's edge (fail2ban / Hostinger rate-limit) blocks the
#   runner's source IP, and observed blocks have held a single runner's IP down
#   for the FULL length of a run (~19 min). All steps in a run share one IP, so
#   retrying from here can't beat that — a 5-attempt / 15-min loop was tried and
#   still lost every attempt. So this workflow makes one honest attempt: green
#   when it gets through, red when the host blocks it. Re-run it to retry on a
#   fresh runner IP.
#
#   The reliable, permanent deploy path does NOT depend on reaching port 22:
#   the pull-based autodeploy in deploy/AUTODEPLOY.md has the VPS pull from
#   GitHub over HTTPS and deploy itself. Enable that and this workflow becomes
#   just a manual fallback.
#
# IMPORTANT — bcrypt hash transport:
#   BABY_AUTH_HASH is a bcrypt hash like $2b$12$...  The '$' characters get
#   re-expanded by the remote shell when forwarded verbatim through
#   appleboy/ssh-action's `envs:` (turning $2b / $12 into empty undefined
#   vars), which leaves Caddy with a broken basic_auth hash and makes it
#   crash-loop -> the site serves a blank page. To avoid that we base64-encode
#   the hash on the runner (base64 has no '$'), forward the safe string, and
#   decode it on the VPS into an exported env var that docker compose then
#   substitutes literally.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only one deploy at a time, and if newer commits land while one is running,
  # supersede the in-flight run instead of queueing a backlog that hammers the
  # host with rapid back-to-back SSH connects.
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One connect attempt (60s) + the remote build. 20 min is plenty.
    timeout-minutes: 20
    steps:
      - name: Check out repo
        # Needed so the local composite action (.github/actions/deploy-vps) and
        # scripts/ are available on the runner.
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SITE_HOSTNAME: ${{ secrets.SITE_HOSTNAME }}
          BABY_AUTH_HASH: ${{ secrets.BABY_AUTH_HASH }}
          BABY_AUTH_COOKIE: ${{ secrets.BABY_AUTH_COOKIE }}
        run: |
          set -euo pipefail

          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PATH SITE_HOSTNAME BABY_AUTH_HASH BABY_AUTH_COOKIE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s\n' "$VPS_SSH_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::VPS_SSH_KEY must contain the private key, including BEGIN/END lines."
            exit 1
          fi

          case "$BABY_AUTH_HASH" in
            '$2'*) : ;;
            *) echo "::error::BABY_AUTH_HASH must be a bcrypt hash (starts with \$2). Generate it with: docker run --rm caddy caddy hash-password --plaintext 'yourpass'"; exit 1 ;;
          esac

      - name: Encode auth hash for safe SSH transport
        id: enc
        env:
          BABY_AUTH_HASH: ${{ secrets.BABY_AUTH_HASH }}
        run: |
          set -euo pipefail
          # base64 (single line, no '$') survives ssh-action env forwarding intact.
          echo "b64=$(printf '%s' "$BABY_AUTH_HASH" | base64 -w0)" >> "$GITHUB_OUTPUT"

      # ── One honest deploy attempt ──
      #    Green if the runner reaches the VPS, red if the host blocks the
      #    connection. If it goes red, re-run the job to retry on a fresh
      #    runner IP — or enable the pull-based autodeploy (deploy/AUTODEPLOY.md)
      #    so deploys stop depending on reaching port 22 at all.
      - name: Deploy over SSH
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          vps_path: ${{ secrets.VPS_PATH }}
          site_hostname: ${{ secrets.SITE_HOSTNAME }}
          http_port: ${{ secrets.BABY_HTTP_PORT }}
          auth_hash_b64: ${{ steps.enc.outputs.b64 }}
          auth_cookie: ${{ secrets.BABY_AUTH_COOKIE }}
          photos_dir: ${{ secrets.PHOTOS_DIR }}
