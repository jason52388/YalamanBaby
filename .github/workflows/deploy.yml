name: Deploy to Hostinger VPS

# Auto-deploys on push to main. SSHes into the VPS, makes sure a clean clone of
# the repo exists, writes .env from GitHub secrets, then builds and (re)starts
# the container. Mirrors the stock-site deployment approach.
#
# Required secrets:
#   Connection:  VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH
#   App config:  SITE_HOSTNAME
# Optional secrets:
#   BABY_HTTP_PORT defaults to 8088
#
# SITE_HOSTNAME is written to .env on every deploy, so the server never needs
# manual configuration — change a secret, push, done. (The live hostname is
# also hardcoded in the Caddyfile; SITE_HOSTNAME is forwarded for parity.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SITE_HOSTNAME: ${{ secrets.SITE_HOSTNAME }}
          BABY_HTTP_PORT: ${{ secrets.BABY_HTTP_PORT }}
          BABY_AUTH_HASH: ${{ secrets.BABY_AUTH_HASH }}
          BABY_AUTH_COOKIE: ${{ secrets.BABY_AUTH_COOKIE }}
        run: |
          set -euo pipefail

          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PATH SITE_HOSTNAME BABY_AUTH_HASH BABY_AUTH_COOKIE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s\n' "$VPS_SSH_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::VPS_SSH_KEY must contain the private key, including BEGIN/END lines."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SITE_HOSTNAME: ${{ secrets.SITE_HOSTNAME }}
          BABY_HTTP_PORT: ${{ secrets.BABY_HTTP_PORT }}
          BABY_AUTH_HASH: ${{ secrets.BABY_AUTH_HASH }}
          BABY_AUTH_COOKIE: ${{ secrets.BABY_AUTH_COOKIE }}
          PHOTOS_DIR: ${{ secrets.PHOTOS_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: SITE_HOSTNAME,BABY_HTTP_PORT,BABY_AUTH_HASH,BABY_AUTH_COOKIE,PHOTOS_DIR
          script: |
            set -euo pipefail

            REPO="https://github.com/jason52388/YalamanBaby.git"
            DIR="${{ secrets.VPS_PATH }}"

            # Ensure a clean clone exists at DIR. If it's missing or isn't a git
            # repo, recreate it. .env is rewritten below regardless.
            if [ ! -d "$DIR/.git" ]; then
              rm -rf "$DIR"
              git clone "$REPO" "$DIR"
            fi

            cd "$DIR"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main

            # Write .env from the secret forwarded above. umask 077 -> chmod 600.
            umask 077
            cat > .env <<EOF
            SITE_HOSTNAME=${SITE_HOSTNAME}
            BABY_HTTP_PORT=${BABY_HTTP_PORT:-8088}
            EOF

            # Make sure the shared proxy network exists (idempotent — no-op
            # if it's already there). warren-caddy joins this same network so
            # it can reverse_proxy to yalaman-baby:80 by container name.
            docker network create proxy-shared 2>/dev/null || true

            # BABY_AUTH_HASH / BABY_AUTH_COOKIE / PHOTOS_DIR are forwarded into
            # this shell (see `envs:` above), so `docker compose` substitutes
            # them via ${...} without writing the bcrypt hash (with its $ signs)
            # into .env. They reach the container as Caddy/compose env vars.
            docker compose up -d --build

            docker image prune -f
