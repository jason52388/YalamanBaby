name: Deploy to Hostinger VPS

# Auto-deploys on push to main. SSHes into the VPS, makes sure a clean clone of
# the repo exists, writes .env from GitHub secrets, then builds and (re)starts
# the container. The actual remote work lives in scripts/deploy-remote.sh and is
# invoked through the local composite action .github/actions/deploy-vps.
#
# Required secrets:
#   Connection:  VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH
#   App config:  SITE_HOSTNAME
#   Auth gate:   BABY_AUTH_HASH (bcrypt), BABY_AUTH_COOKIE (random hex)
# Optional secrets:
#   BABY_HTTP_PORT defaults to 8088
#   PHOTOS_DIR     defaults to /srv/yalaman-photos
#
# RETRIES — why this workflow spreads the SSH deploy over ~15 minutes:
#   The GitHub runner intermittently can't open a TCP connection to the VPS on
#   port 22 ("dial tcp ...:22: i/o timeout"). The SYN packets are dropped, not
#   refused — the host's edge (fail2ban / Hostinger rate-limit) temporarily
#   blocks the runner's source IP for a window of several minutes.
#
#   All steps in one run share a single runner IP, so retrying within a short
#   window loses every attempt together (an earlier 3-try / ~5-min loop did).
#   But dropped SYNs never reach sshd, so a fail2ban-style ban is NOT refreshed
#   by our retries — it expires on its own (~10 min). So we keep trying, with
#   growing backoff, across a ~15-minute window that outlasts the ban; the
#   later attempts get through once it lifts. Only if EVERY attempt fails does
#   the job go red.
#
#   For a deploy path that never depends on reaching port 22 at all, see the
#   pull-based autodeploy in deploy/AUTODEPLOY.md (recommended permanent fix).
#
# IMPORTANT — bcrypt hash transport:
#   BABY_AUTH_HASH is a bcrypt hash like $2b$12$...  The '$' characters get
#   re-expanded by the remote shell when forwarded verbatim through
#   appleboy/ssh-action's `envs:` (turning $2b / $12 into empty undefined
#   vars), which leaves Caddy with a broken basic_auth hash and makes it
#   crash-loop -> the site serves a blank page. To avoid that we base64-encode
#   the hash on the runner (base64 has no '$'), forward the safe string, and
#   decode it on the VPS into an exported env var that docker compose then
#   substitutes literally.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only one deploy at a time, and if newer commits land while one is running,
  # supersede the in-flight run instead of queueing a backlog that hammers the
  # host with rapid back-to-back SSH connects.
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Must comfortably exceed the cumulative retry backoff below (~15 min) plus
    # the remote build, so the loop is never cut short mid-ride-out.
    timeout-minutes: 25
    steps:
      - name: Check out repo
        # Needed so the local composite action (.github/actions/deploy-vps) and
        # scripts/ are available on the runner.
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SITE_HOSTNAME: ${{ secrets.SITE_HOSTNAME }}
          BABY_AUTH_HASH: ${{ secrets.BABY_AUTH_HASH }}
          BABY_AUTH_COOKIE: ${{ secrets.BABY_AUTH_COOKIE }}
        run: |
          set -euo pipefail

          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PATH SITE_HOSTNAME BABY_AUTH_HASH BABY_AUTH_COOKIE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s\n' "$VPS_SSH_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::VPS_SSH_KEY must contain the private key, including BEGIN/END lines."
            exit 1
          fi

          case "$BABY_AUTH_HASH" in
            '$2'*) : ;;
            *) echo "::error::BABY_AUTH_HASH must be a bcrypt hash (starts with \$2). Generate it with: docker run --rm caddy caddy hash-password --plaintext 'yourpass'"; exit 1 ;;
          esac

      - name: Encode auth hash for safe SSH transport
        id: enc
        env:
          BABY_AUTH_HASH: ${{ secrets.BABY_AUTH_HASH }}
        run: |
          set -euo pipefail
          # base64 (single line, no '$') survives ssh-action env forwarding intact.
          echo "b64=$(printf '%s' "$BABY_AUTH_HASH" | base64 -w0)" >> "$GITHUB_OUTPUT"

      # ── Deploy, retrying across a ~15-min window to outlast the host's
      #    source-IP block (see the RETRIES note at the top of this file) ──
      - name: Deploy over SSH (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          vps_path: ${{ secrets.VPS_PATH }}
          site_hostname: ${{ secrets.SITE_HOSTNAME }}
          http_port: ${{ secrets.BABY_HTTP_PORT }}
          auth_hash_b64: ${{ steps.enc.outputs.b64 }}
          auth_cookie: ${{ secrets.BABY_AUTH_COOKIE }}
          photos_dir: ${{ secrets.PHOTOS_DIR }}

      - name: Backoff before attempt 2
        if: steps.deploy1.outcome == 'failure'
        shell: bash
        run: echo "Attempt 1 failed (host dropped the connect); retrying in 120s…"; sleep 120

      - name: Deploy over SSH (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          vps_path: ${{ secrets.VPS_PATH }}
          site_hostname: ${{ secrets.SITE_HOSTNAME }}
          http_port: ${{ secrets.BABY_HTTP_PORT }}
          auth_hash_b64: ${{ steps.enc.outputs.b64 }}
          auth_cookie: ${{ secrets.BABY_AUTH_COOKIE }}
          photos_dir: ${{ secrets.PHOTOS_DIR }}

      - name: Backoff before attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        shell: bash
        run: echo "Attempt 2 failed; retrying in 180s…"; sleep 180

      - name: Deploy over SSH (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          vps_path: ${{ secrets.VPS_PATH }}
          site_hostname: ${{ secrets.SITE_HOSTNAME }}
          http_port: ${{ secrets.BABY_HTTP_PORT }}
          auth_hash_b64: ${{ steps.enc.outputs.b64 }}
          auth_cookie: ${{ secrets.BABY_AUTH_COOKIE }}
          photos_dir: ${{ secrets.PHOTOS_DIR }}

      - name: Backoff before attempt 4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        shell: bash
        run: echo "Attempt 3 failed; retrying in 240s…"; sleep 240

      - name: Deploy over SSH (attempt 4)
        id: deploy4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          vps_path: ${{ secrets.VPS_PATH }}
          site_hostname: ${{ secrets.SITE_HOSTNAME }}
          http_port: ${{ secrets.BABY_HTTP_PORT }}
          auth_hash_b64: ${{ steps.enc.outputs.b64 }}
          auth_cookie: ${{ secrets.BABY_AUTH_COOKIE }}
          photos_dir: ${{ secrets.PHOTOS_DIR }}

      - name: Backoff before attempt 5
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.deploy4.outcome == 'failure'
        shell: bash
        run: echo "Attempt 4 failed; final retry in 300s…"; sleep 300

      - name: Deploy over SSH (attempt 5, final)
        id: deploy5
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.deploy4.outcome == 'failure'
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          vps_path: ${{ secrets.VPS_PATH }}
          site_hostname: ${{ secrets.SITE_HOSTNAME }}
          http_port: ${{ secrets.BABY_HTTP_PORT }}
          auth_hash_b64: ${{ steps.enc.outputs.b64 }}
          auth_cookie: ${{ secrets.BABY_AUTH_COOKIE }}
          photos_dir: ${{ secrets.PHOTOS_DIR }}

      - name: Confirm deploy succeeded
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success' || steps.deploy4.outcome == 'success' || steps.deploy5.outcome == 'success'
        shell: bash
        run: echo "✅ Deploy succeeded."
