# Runs behind your existing caddy-docker-proxy.
# No published ports and no own HTTPS — the proxy reaches this container over
# the shared `caddy` network and routes/terminates TLS based on the labels.
# (No top-level `version:` field on purpose — hosted parsers reject it.)
services:
  web:
    image: ghcr.io/jason52388/yalamanbaby:latest
    restart: unless-stopped
    networks:
      - caddy
    labels:
      caddy: ${SITE_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy:
    external: true
