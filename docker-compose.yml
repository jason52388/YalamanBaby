# Mirrors the stock-site deployment pattern.
#
# NOTE: No `version:` field — Hostinger's compose parser rejects it.
# NOTE: Explicit `environment:` (not `env_file:`) — Hostinger silently drops
#       env_file.
# NOTE: Named volumes (not bind mounts) — Hostinger runs containers from a path
#       that lacks the repo files, so relative bind mounts resolve to empty
#       dirs. The Caddyfile and built site are baked into the image instead.
#
# This container exposes NO host ports. It serves on port 80 internally and
# joins the shared external `proxy-shared` Docker network so the public
# warren-caddy (on the same VPS) can reverse_proxy to it by container name.
services:
  web:
    build: .
    container_name: yalaman-baby
    restart: unless-stopped
    environment:
      - SITE_HOSTNAME=${SITE_HOSTNAME}
    networks:
      - baby
      - proxy-shared

networks:
  baby:
    driver: bridge
  # Shared with warren-caddy so the public reverse proxy can reach this app.
  # Created by the deploy workflow if it doesn't already exist.
  proxy-shared:
    external: true
